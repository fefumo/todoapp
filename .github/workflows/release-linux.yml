name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.10.*"
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: icu qtbase qtsvg qtwayland
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix "$PWD/stage"

      - name: Package
        run: tar -czf todoapp-linux-x86_64.tar.gz -C stage .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: todoapp-linux-x86_64
          path: todoapp-linux-x86_64.tar.gz

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: todoapp-linux-x86_64.tar.gz
          generate_release_notes: true
