name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.10.*"
  BUILD_TYPE: Release

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: qtbase qtsvg
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix "$PWD/stage"

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent stage todoapp-macos-arm64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-macos-arm64
          path: todoapp-macos-arm64.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: todoapp-macos-arm64.zip
          generate_release_notes: true
