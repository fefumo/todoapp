name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.10.*"
  BUILD_TYPE: Release

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: qtbase qtsvg
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix "${{ github.workspace }}/stage"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath todoapp-windows-x86_64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-windows-x86_64
          path: todoapp-windows-x86_64.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: todoapp-windows-x86_64.zip
          generate_release_notes: true
